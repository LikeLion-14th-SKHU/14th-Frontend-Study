<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Tailwind CSS CDN</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="border-2 border-black w-[600px] h-[300px] from-indigo-500 bg-gradient-to-br"
    ></div>
    <hr class="my-10" />
    <div
      class="border-2 border-black w-[600px] h-[300px] from-cyan-500 to-pink-300 bg-gradient-to-r"
    ></div>
    <hr class="my-10" />
    <div
      class="border-2 border-black w-[600px] h-[300px] bg-gradient-to-r from-cyan-500 to-pink-300 via-indigo-500"
    ></div>
    <hr class="my-10" />
    <div
      class="border-2 border-black w-[600px] h-[300px] bg-gradient-to-r from-red-500 to-transparent"
    ></div>
    <hr class="my-10" />
    <div class="border-2 border-black w-[600px] h-[300px]"></div>
    <hr class="my-10" />

    <button
      class="border-2 p-3 rounded-full px-6 bg-gradient-to-r from-[#d4fc79] to-[#96e6a1] text-white font-bold hover:bg-gradient-to-l"
      type="button"
    >
      Change Gradient Color
    </button>
  </body>
</html>
