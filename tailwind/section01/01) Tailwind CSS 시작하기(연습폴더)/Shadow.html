<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Shadow</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20 bg-amber-200">
    <div>
      <div
        class="size-[100px] bg-white rounede-xl inline-block mx-5 shadow-sm"
      ></div>
      <div
        class="size-[100px] bg-white rounede-xl inline-block mx-5 shadow-lg"
      ></div>
      <div
        class="size-[100px] bg-white rounede-xl inline-block mx-5 shadow-xl hover:shadow-none"
      ></div>
      <div
        class="size-[100px] bg-white rounede-xl inline-block mx-5 shadow-2xl"
      ></div>
      <div
        class="size-[100px] bg-white rounede-xl inline-block mx-5 shadow-inner"
      ></div>
    </div>
  </body>
</html>
