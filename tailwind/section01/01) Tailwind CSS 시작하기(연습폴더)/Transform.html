<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Transform</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20">
    <div>
      <img
        class="inline-block m-10 scale-150"
        src="../images/duck.jpg"
        alt=""
      />
      <img
        class="inline-block m-10 scale-[0.5]"
        src="../images/duck.jpg"
        alt=""
      />
      <img
        class="inline-block m-10 scale-x-[1.5]"
        src="../images/duck.jpg"
        alt=""
      />
      <img
        class="inline-block m-10 scale-y-[1.5]"
        src="../images/duck.jpg"
        alt=""
      />
    </div>

    <div>
      <img
        class="inline-block m-10 scale-150 rotate-[45deg]"
        src="../images/duck.jpg"
        alt=""
      />
      <img
        class="inline-block m-10 scale-[0.5] rotate-[-45deg]"
        src="../images/duck.jpg"
        alt=""
      />
    </div>

    <div>
      <img
        class="inline-block m-10 scale-150 rotate-[45deg] skew-y-[20deg]"
        src="../images/duck.jpg"
        alt=""
      />
      <img
        class="inline-block m-10 scale-[0.5] rotate-[-45deg] skew-x-[-20deg]"
        src="../images/duck.jpg"
        alt=""
      />
    </div>

    <hr class="my-10" />
    <div class="size-[300px] bg-black m-10"></div>
    <div class="size-[300px] bg-black m-10"></div>
  </body>
</html>
