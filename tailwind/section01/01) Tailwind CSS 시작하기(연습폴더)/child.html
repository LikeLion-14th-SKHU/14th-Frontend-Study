<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Tailwind CSS CDN</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20">
    <div
      class="[&>p]:border [&>p]:border-black [&>p]:border-dashed [&>p]:p-1 [&>p]:m-1"
    >
      <p>Text Content</p>
      <p>Text Content</p>
      <p>Text Content</p>
      <p>Text Content</p>
    </div>

    <hr class="my-10" />

    <ul class="[&>li]:border [&>li]:p-1 [&>li]:my-1 [&>li:hover]:bg-blue-500">
      <li>Home</li>
      <li>About</li>
      <li>Projects</li>
      <li>Contact</li>
    </ul>
  </body>
</html>
