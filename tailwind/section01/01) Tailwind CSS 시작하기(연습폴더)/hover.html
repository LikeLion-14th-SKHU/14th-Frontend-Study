<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Tailwind CSS CDN</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20">
    <button
      class="bg-orange-400 text-white p-2 px-5 rounded-full hover:bg-orange-600"
    >
      자세히 보기
    </button>

    <hr class="my-10" />

    <button
      class="bg-sky-400 text-white p2 px-5 rounded-full focus:ring-green-300 focus:ring"
    >
      회원정보 변경하기
    </button>
    <hr class="my-10" />
    <!-- Active -->
    <button
      class="bg-orange-400 text-thite p-2 px-5 rounded-full active:bg-green-400"
    >
      변경사항 저장하기
    </button>
    <hr class="my-10" />
    <button
      class="bg-slate-400 text-thite p-2 px-5 rounded-full active:scale-[0.7] tansition-all duration-[300ms]"
    >
      변경사항 저장하기
    </button>
    <hr class="my-10" />

    <a
      class="before:content-['New'] before:text-[12px] before:bg-blue-400 before:text-white before:px-1 before:mr-1 before:rounded-md after:content-['update'] after:bg-[crimson] after:text-white after:text-[12px] after:ml-2 after:uppercase"
      href="#none"
      >코딩웍스 온라인 클래스</a
    >
  </body>
</html>
