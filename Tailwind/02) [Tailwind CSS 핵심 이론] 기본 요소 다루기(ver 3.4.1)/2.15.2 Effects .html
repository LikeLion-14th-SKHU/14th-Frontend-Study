<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Box Shadow, Text Shadow</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20">
    <h1
      class="text-9xl font-bold text-red-500 [text-shadow:-10px_-10px_0_orange]"
    >
      CodingWorks
    </h1>

    <hr class="my-10" />

    <h1 class="text-9xl font-bold text-red-500 [text-shadow:0_0_20px_black]">
      CodingWorks
    </h1>

    <hr class="my-10" />

    <h1
      class="text-9xl font-bold text-red-500 [text-shadow:0_0_20px_rgba(0,0,0,0.4)]"
    >
      CodingWorks
    </h1>
  </body>
</html>
