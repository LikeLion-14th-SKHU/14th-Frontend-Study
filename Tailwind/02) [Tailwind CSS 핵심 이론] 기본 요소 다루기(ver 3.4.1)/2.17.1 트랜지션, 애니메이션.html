<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Transitions & Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20">
    <button
      class="bg-blue-500 text-white py-3 px-5 rounded-xl hover:bg-purple-500 transition-all duration-[300ms] delay-[2000ms]"
    >
      Transition Effect
    </button>

    <hr class="my-10" />

    <button
      class="bg-blue-500 text-white py-3 px-5 rounded-xl hover:bg-purple-500 hover:rounded-none transition-all duration-[300ms] hover:tracking-widest w-[200px] ease-out"
    >
      Transition Effect
    </button>
  </body>
</html>
