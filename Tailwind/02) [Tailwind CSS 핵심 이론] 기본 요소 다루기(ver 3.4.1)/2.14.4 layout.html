<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Layout Position</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-10">
    <div class="border-[4px] border-red-500 w-[600px] h-[300px]">
      <div class="size-[100px] bg-purple-500"></div>
    </div>

    <hr class="my-10" />

    <div class="border-[4px] border-red-500 w-[600px] h-[300px] relative">
      <div
        class="size-[100px] bg-purple-500 absolute top-[-50px] right-[-50px]"
      ></div>
    </div>
  </body>
</html>
