<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Borders</title>
    <script src="https://cdn.tailwindcss.com"></script></head
  ><!--보더 종류 및 테두리-->
  <body class="m-20">
    <div class="flex">
      <div
        class="m-5 w-[100px] h-[100px] border border-black border-dashed"
      ></div>
      <div
        class="m-5 w-[100px] h-[100px] border-2 border-black border-dashed"
      ></div>
      <div
        class="m-5 w-[100px] h-[100px] border-4 border-black border-dashed"
      ></div>
      <div
        class="m-5 w-[100px] h-[100px] border-[10px] border-[crimson] border-dashed"
      ></div>
    </div>
    <hr class="m-10" />
    <div class="flex">
      <div class="m-5 w-[100px] h-[100px] border-r-2 border-[crimson]"></div>
      <div class="m-5 w-[100px] h-[100px] border-l-2 border-[crimson]"></div>
      <div class="m-5 w-[100px] h-[100px] border-t-2 border-[crimson]"></div>
      <div class="m-5 w-[100px] h-[100px] border-b-2 border-[crimson]"></div>
      <div class="m-5 w-[100px] h-[100px] border-x-2 border-[green]"></div>
      <div class="m-5 w-[100px] h-[100px] border-y-2 border-[green]"></div>
    </div>

    <hr class="m-10" />

    <div class="flex">
      <div
        class="m-5 w-[100px] h-[100px] border-2 border-purple-500 rounded"
      ></div>
      <div
        class="m-5 w-[100px] h-[100px] border-2 border-purple-500 rounded-md"
      ></div>
      <div
        class="m-5 w-[100px] h-[100px] border-2 border-purple-500 rounded-lg"
      ></div>
      <div
        class="m-5 w-[100px] h-[100px] border-2 border-purple-500 rounded-full"
      ></div>
    </div>
    <hr class="m-5" />
    <button
      class="border-2 border-teal-600 text-[14px] px-4 py-2 rounded-full hover:rounded-none"
    >
      Save Changes
    </button>
  </body>
</html>
