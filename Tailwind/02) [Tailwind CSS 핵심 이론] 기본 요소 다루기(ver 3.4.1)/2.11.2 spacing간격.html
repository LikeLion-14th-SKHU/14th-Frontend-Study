<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Spacing(Margin Padding), Sizing(Width, Height), Size</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="border-2 border-rose-500 text-[20px] text-center p-10 w-full h-screen"
    >
      국회의원은 그 지위를 남용하여 국가·공공단체 또는 기업체와의 계약이나 그
      처분에 의하여 재산상의 권리·이익 또는 직위를 취득하거나 타인을 위하여 그
      취득을 알선할 수 없다. 국군의 조직과 편성은 법률로 정한다. 군인은 현역을
      면한 후가 아니면 국무총리로 임명될 수 없다. 모든 국민은 법률이 정하는 바에
      의하여 선거권을 가진다.
    </div>
  </body>
</html>
