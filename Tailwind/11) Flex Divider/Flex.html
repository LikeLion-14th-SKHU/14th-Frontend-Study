<!DOCTYPE html>
<html lang="ko">
<head>

  <title>Tailwind CSS CDN</title>

<body class="m-2">

    <div>01</div>
    <div>02</div>

    <p>05</p>

   </div>
   <!-- flex - 자식요소 너비 자동 설정 -->
    <div class="flex gap-3">
      <div class="h-32 bg-blue-500 text-white font-bold rounded-md p-3 shadow-md">01</div>
      <div class="h-32 bg-blue-500 text-white font-bold rounded-md p-3 shadow-md">02</div>
      <div class="h-32 bg-blue-500 text-white font-bold rounded-md p-3 shadow-md">03</div>
    </div>
</body>
</html>
