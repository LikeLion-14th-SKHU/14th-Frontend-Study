<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Box-Shadow</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20 bg-amber-200">
    <div>
      <div
        class="size-[100px] bg-white rounded-xl inline-block m-5 shadow-sm"
      ></div>
      <div
        class="size-[100px] bg-white rounded-xl inline-block m-5 shadow-lg"
      ></div>
      <div
        class="size-[100px] bg-[yellowgreen] rounded-xl inline-block m-5 shadow-xl hover:shadow-none"
      ></div>
      <div
        class="size-[100px] bg-pink-500 rounded-xl inline-block m-5 shadow-2xl shadow-blue-500"
      ></div>
      <div
        class="size-[100px] bg-white rounded-xl inline-block m-5 shadow-indder"
      ></div>
      <div
        class="size-[100px] bg-white rounded-xl inline-block m-5 shadow-none hover:shadow-2xl"
      ></div>
    </div>
  </body>
</html>
