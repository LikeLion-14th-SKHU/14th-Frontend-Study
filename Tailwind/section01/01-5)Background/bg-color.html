<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>bg color</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20">
    <div
      class="border-2 border-black w-[600px] h-[300px] from-indigo-500 bg-gradient-to-tr"
    ></div>
    <hr class="my-10" />
    <div
      class="border-2 border-black w-[600px] h-[300px] from-cyan-500 to-pink-300 bg-gradient-to-l"
    ></div>
    <hr class="my-10" />
    <div
      class="border-2 border-black w-[600px] h-[300px] bg-gradient-to-r from-cyan-500 to-pink-300 via-indigo-500"
    ></div>
    <hr class="my-10" />
    <div
      class="border-2 border-black w-[600px] h-[300px] bg-gradient-to-r from-red-500 to-transparent"
    ></div>
    <hr class="my-10" />
    <button
      type="button"
      class="border-2 p-3 px-5 rounded-full bg-gradient-to-r from-[#d4fc79] to-[#96e9a1] text-white font-bold hover:bg-gradient-to-l"
    >
      Change Gradient Color
    </button>
  </body>
</html>
