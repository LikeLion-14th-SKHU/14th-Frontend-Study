<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link

    />
  </head>
  <body class="m-20">
    <div class="my-3">
      <select name="" id="">
