<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Pointer Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="m-20">
    <div class="w-[250px] relative">
      <span
        class="absolute text-[20px] text-gray-500 left-[10px] top-[6px] pointer-events-none"
      >
        <i class="bi bi-search"></i>
      </span>
      <input
        class="border w-[250px] p-2 rounded-md outline-none pl-[35px] focus:border-[crimson] text-[crimson]"
        type="text"
        placeholder="Search..."
      />
    </div>
  </body>
</html>
