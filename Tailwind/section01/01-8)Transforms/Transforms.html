<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Transforms</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-20">
    <div class="w-[200px] h-[100px] bg-[crimson] m-20 rotate-[90deg]"></div>
    <div
      class="w-[200px] h-[100px] bg-[blue] m-20 rotate-[90deg] origin-top-left"
    ></div>
    <hr class="my-10" />
    <div class="w-[200px] h-[100px] bg-[crimson] m-20 scale-x-[1.5]"></div>
    <div
      class="w-[200px] h-[100px] bg-[blue] m-20 scale-x-[1.5] origin-left"
    ></div>
    <hr class="my-10" />

    <div>
      <img
        class="rounded-xl inline-block m-10 scale-[1.5]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 scale-[0.5]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 scale-x-[1.5]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 scale-y-[1.5]"
        src="../images/duck.jpg"
      />
    </div>
    <hr class="my-10" />
    <div>
      <img
        class="rounded-xl inline-block m-10 rotate-[45deg]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 rotate-[-45deg]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 rotate-[180deg]"
        src="../images/duck.jpg"
      />
    </div>
    <hr class="my-10" />
    <div>
      <img class="rounded-xl inline-block m-10" src="../images/duck.jpg" />
      <img
        class="rounded-xl inline-block m-10 skew-y-[20deg]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 skew-y-[-20deg]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 skew-x-[20deg]"
        src="../images/duck.jpg"
      />
      <img
        class="rounded-xl inline-block m-10 skew-x-[-20deg]"
        src="../images/duck.jpg"
      />
    </div>
    <hr class="my-10" />
    <!-- <img class="scale-[1.5] rotate-[90deg]" src="../images/duck.jpg" /> -->
  </body>
</html>
