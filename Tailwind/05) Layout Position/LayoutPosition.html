<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS CDN</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-20">
  <iframe class="w-[750px] aspect-video" src="https://www.youtube.com/embed/PlvcSryTZlA?si=DA8-ygGQCcSsb3K9" frameborder="0"></iframe>
  <div class="border-4 border-black w-[500px] aspect-video"></div>
  <hr class="my-10">
  <div class="border-4 border-black w-[500px] aspect-square"></div>
  <hr class="my-10">
  <div class="border-4 border-black w-[250px] aspect-[9/16]"></div>
  <hr class="my-10">
  <div class="border-4 border-black w-[650px] aspect-[2.35/1]"></div>
  <hr class="my-10">
  <img src="../images/duck.jpg">
  <img src="../images/duck.jpg">
  <img src="../images/duck.jpg">
  <img src="../images/duck.jpg">
  <!-- block이 이미 적용됨 in tailwindcss -->
  <hr class="my-10">
  <div class="border-[8px] border-pink-500 w-[800px] h-[500px]">
    <img class="object-cover w-full h-full" src="../images/stones.jpg" alt="">
  </div>
  <hr class="my-10">
  <div class="border-[8px] border-pink-500 w-[500px] h-[800px]">
    <img class="object-cover w-full h-full object-[23%_center]" src="../images/china-girl.jpg" alt="">
  </div>
</body>
</html>
