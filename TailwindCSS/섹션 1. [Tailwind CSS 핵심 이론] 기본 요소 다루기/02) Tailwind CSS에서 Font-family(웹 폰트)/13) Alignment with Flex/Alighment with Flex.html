<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Alignment with Flex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="m-20">
    <div class="border-4 border-black w-[800px]flex justify-center">
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[200px] h-[50px] rounded-md"
      >
        01
      </div>
    </div>

    <hr class="my-10" />

    <div class="border-4 border-black w-[800px] flex justify-between">
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        01
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        02
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        03
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        04
      </div>
    </div>
    <hr class="my-10" />

    <div class="border-4 border-black w-[800px] flex justify-between">
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        Logo
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        Navigation
      </div>
    </div>
    <hr class="my-10" />

    <div
      class="border-4 border-black w-[800px] h-[300px] flex gap-3 items-center justify-center"
    >
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        01
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        02
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md"
      >
        03
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[100px] h-[50px] rounded-md self-start"
      >
        04
      </div>
    </div>

    <hr class="my-10" />

    <div
      class="border-4 border-black w-[800px] h-[300px] flex gap-3 flex-wrap content-center justify-center"
    >
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[200px] h-[50px] rounded-md"
      >
        01
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[200px] h-[50px] rounded-md"
      >
        02
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[200px] h-[50px] rounded-md"
      >
        03
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[200px] h-[50px] rounded-md"
      >
        04
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[200px] h-[50px] rounded-md"
      >
        05
      </div>
      <div
        class="bg-purple-500 text-center leading-[50px] text-white w-[200px] h-[50px] rounded-md"
      >
        06
      </div>
    </div>

    <hr class="my-10" />
    <div
      class="border-4 border-blue-500 w-[800px] h-[300px] flex items-center justify-center"
    >
      <div
        class="bg-purple-500 text-center text-white w-[200px] h-[50px] rounded-md"
      >
        child
      </div>
    </div>

    <hr class="my-10" />

    <div
      class="w-[400px] h-[300px] border p-4 shadow-lg rounded-md flex items-center text-center"
    >
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem
      laboriosam possimus maxime quaerat quod fuga architecto fugiat, nostrum
      numquam quibusdam.
    </div>

    <hr class="my-10" />

    <div
      class="border border-black size-[50px] rounded-full flex justify-center items-center cursor-pointer"
    >
      <span class="text-3xl rotate-[180deg]"
        ><i class="bi bi-arrow-down-short"></i
      ></span>
    </div>
  </body>
</html>
